<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Per-page SEO tags (title, description, canonical, robots, Open Graph,
         Twitter, geo, author) are NOT written here. Every page renders them
         from <SEO> in src/components/SEO.jsx, and scripts/prerender.mjs
         injects each page's own set at build time, in place of the marker
         below.

         They used to be hardcoded here with the home page's values. Every
         route then shipped the home page's title and canonical in its raw
         HTML, and once JS ran the client added the page's real tags beside
         them - two titles, two descriptions, two canonicals on every page.
         Keep this file free of them. -->
    <!--app-head-->

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#08080a" />
    <meta name="msapplication-TileColor" content="#08080a" />

    <!-- Fonts (self-hosted) -->
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Space Grotesk - latin-ext */
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/space-grotesk-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      /* Space Grotesk - latin */
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/space-grotesk-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Manrope - latin-ext */
      @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/manrope-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      /* Manrope - latin */
      @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/manrope-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    </style>

    <!-- The logo preload comes from the page itself (its <img> is fetchpriority=high),
         so it is injected with each prerendered page rather than repeated here. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- No <noscript> fallback: pages are prerendered, so their content is already
         in the HTML. The old one put an H1 telling crawlers to enable scripts into
         every route's raw HTML. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
