  <path d="M980 296a72 72 0 0158.3 114.4" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="22" stroke-linecap="round"/>

  <!-- table -->
  <rect x="228" y="524" width="920" height="164" rx="12" fill="#ffffff" fill-opacity=".04"/>
  <rect x="252" y="550" width="160" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
  <rect x="252" y="590" width="872" height="8" rx="4" fill="#ffffff" fill-opacity=".05"/>
