<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Product screenshot placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1200" height="46" fill="#ffffff" fill-opacity=".035"/>
  <circle cx="28" cy="23" r="6" fill="#ffffff" fill-opacity=".13"/>
  <circle cx="50" cy="23" r="6" fill="#ffffff" fill-opacity=".13"/>
  <circle cx="72" cy="23" r="6" fill="#ffffff" fill-opacity=".13"/>
  <rect x="104" y="15" width="240" height="16" rx="8" fill="#ffffff" fill-opacity=".07"/>

  <!-- sidebar -->
  <rect x="0" y="46" width="196" height="674" fill="#ffffff" fill-opacity=".025"/>
  <rect x="24" y="82" width="120" height="12" rx="6" fill="#ffffff" fill-opacity=".10"/>
  <rect x="24" y="126" width="148" height="10" rx="5" fill="#ffffff" fill-opacity=".06"/>
  <rect x="24" y="158" width="128" height="10" rx="5" fill="#ffffff" fill-opacity=".06"/>
  <rect x="24" y="190" width="140" height="10" rx="5" fill="#ffffff" fill-opacity=".06"/>
  <rect x="24" y="222" width="112" height="10" rx="5" fill="#ffffff" fill-opacity=".06"/>
