  <!-- chart panel -->
  <rect x="228" y="222" width="560" height="270" rx="12" fill="#ffffff" fill-opacity=".04"/>
  <rect x="252" y="248" width="140" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
  <rect x="264" y="404" width="44" height="60" rx="5" fill="#ffffff" fill-opacity=".10"/>
  <rect x="330" y="366" width="44" height="98" rx="5" fill="#ffffff" fill-opacity=".10"/>
