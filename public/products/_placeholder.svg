  <rect x="252" y="134" width="118" height="22" rx="6" fill="url(#bar)"/>

  <rect x="464" y="86" width="212" height="104" rx="12" fill="#ffffff" fill-opacity=".04"/>
  <rect x="488" y="110" width="72" height="9" rx="4" fill="#ffffff" fill-opacity=".08"/>
  <rect x="488" y="134" width="98" height="22" rx="6" fill="url(#bar)"/>

  <rect x="700" y="86" width="212" height="104" rx="12" fill="#ffffff" fill-opacity=".04"/>
  <rect x="724" y="110" width="72" height="9" rx="4" fill="#ffffff" fill-opacity=".08"/>
  <rect x="724" y="134" width="132" height="22" rx="6" fill="url(#bar)"/>

  <rect x="936" y="86" width="212" height="104" rx="12" fill="#ffffff" fill-opacity=".04"/>
